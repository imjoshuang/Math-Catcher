<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <title>Math Catcher</title>
        <link rel="icon" type="image/png" href="assets/basket.png">
        <style>
            /* Reset CSS: Please avoid making changes here unless you know what you're doing :) */
            *,
            *::before,
            *::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
    
            html, body {
                width: 100%;
                height: 100%;
            }
    
            body {
                line-height: 1;
                font-family: Arial, sans-serif;
                background-color: #040218;
            }
    
        ol, ul {
            list-style: none;
        }

        img, video {
            max-width: 100%;
            height: auto;
            display: block;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        #game-container {
            width: 100%;
            height: 100%;
        }

        html, body {
            overflow: hidden;
            touch-action: none;
        }

        #rotate-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #040218;
            z-index: 99999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: clamp(16px, 4vw, 28px);
            text-align: center;
            gap: 24px;
        }

        #rotate-overlay svg {
            width: clamp(60px, 12vw, 100px);
            height: clamp(60px, 12vw, 100px);
            animation: rotate-hint 1.8s ease-in-out infinite;
        }

        @keyframes rotate-hint {
            0%   { transform: rotate(0deg); }
            40%  { transform: rotate(90deg); }
            60%  { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        @media (orientation: portrait) {
            #rotate-overlay { display: flex; }
        }
        </style>
    </head>
    <body>
        <div id="rotate-overlay">
            <svg viewBox="0 0 24 24" fill="none" stroke="#3ad8ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="2" width="14" height="20" rx="2"/>
                <path d="M12 18h.01"/>
            </svg>
            <p>Please rotate your device<br>to landscape mode</p>
        </div>
        <div id="game-container"></div>
        <script src="./phaser.js"></script>
        <script type="module" src="./src/main.js"></script>
        <script>
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        </script>
    </body>
    </html>
