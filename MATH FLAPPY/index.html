<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <title>Math Catcher</title>
        <link rel="icon" type="image/png" href="assets/basket.png">
        <style>
            /* Reset CSS: Please avoid making changes here unless you know what you're doing :) */
            *,
            *::before,
            *::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
    
            html, body {
                width: 100%;
                height: 100%;
            }
    
            body {
                line-height: 1;
                font-family: Arial, sans-serif;
                background-color: #040218;
            }
    
        ol, ul {
            list-style: none;
        }

        img, video {
            max-width: 100%;
            height: auto;
            display: block;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        #game-container {
            width: 100%;
            height: 100%;
        }

        html, body {
            overflow: hidden;
            touch-action: none;
        }

        #rotate-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #040218;
            z-index: 99999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: clamp(16px, 4vw, 28px);
            text-align: center;
            gap: 24px;
        }

        #rotate-overlay svg {
            width: clamp(60px, 12vw, 100px);
            height: clamp(60px, 12vw, 100px);
            animation: rotate-hint 1.8s ease-in-out infinite;
        }

        @keyframes rotate-hint {
            0%   { transform: rotate(0deg); }
            40%  { transform: rotate(90deg); }
            60%  { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        @media (orientation: portrait) {
            #rotate-overlay { display: flex; }
        }

        .deadmath-link {
            position: absolute;
            bottom: 16px;
            right: 16px;
            z-index: 100;
            background: rgba(58, 216, 255, 0.2);
            border: 2px solid #3ad8ff;
            border-radius: 18px;
            color: #ffffff;
            padding: 10px 16px;
            font-size: clamp(14px, 2vw, 18px);
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .deadmath-link:hover {
            background: rgba(58, 216, 255, 0.35);
        }
        .flipmath-link {
            position: absolute;
            bottom: 16px;
            left: 16px;
            z-index: 100;
            background: rgba(0, 255, 136, 0.08);
            border: 2px solid #00ff88;
            border-radius: 18px;
            color: #ffffff;
            padding: 10px 16px;
            font-size: clamp(14px, 2vw, 18px);
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .flipmath-link:hover { background: rgba(0, 255, 136, 0.18); }
        .rival-link {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 100;
            background: rgba(255, 136, 0, 0.08);
            border: 2px solid #ff8844;
            border-radius: 18px;
            color: #ffffff;
            padding: 10px 16px;
            font-size: clamp(14px, 2vw, 18px);
            cursor: pointer;
            backdrop-filter: blur(8px);
        }
        .rival-link:hover { background: rgba(255, 136, 0, 0.18); }
        .duck-link {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 100;
            background: rgba(255, 200, 0, 0.08);
            border: 2px solid #ffcc00;
            border-radius: 18px;
            color: #ffffff;
            padding: 10px 16px;
            font-size: clamp(14px, 2vw, 18px);
            cursor: pointer;
            backdrop-filter: blur(8px);
        }
        .duck-link:hover { background: rgba(255, 200, 0, 0.18); }
        </style>
    </head>
    <body>
        <div id="rotate-overlay">
            <svg viewBox="0 0 24 24" fill="none" stroke="#3ad8ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="2" width="14" height="20" rx="2"/>
                <path d="M12 18h.01"/>
            </svg>
            <p>Please rotate your device<br>to landscape mode</p>
        </div>
        <div id="game-container"></div>
        <button class="deadmath-link" id="deadMathLink" type="button">DEAD MATH</button>
        <button class="flipmath-link" id="flipMathLink" type="button">FLIP MATH</button>
        <button class="rival-link" id="rivalMathLink" type="button">RIVAL MATH</button>
        <button class="duck-link" id="duckLink" type="button">DUCK SHOOTER</button>
        <script src="./phaser.js"></script>
        <script type="module" src="./src/main.js"></script>
        <script>
            const deadMathLink = document.getElementById('deadMathLink');
            if (deadMathLink) {
                deadMathLink.addEventListener('click', () => {
                    window.location.href = 'dead-math.html';
                });
            }
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
            const flipMathLink = document.getElementById('flipMathLink');
            if (flipMathLink) {
                flipMathLink.addEventListener('click', () => {
                    window.location.href = 'flipmath.html';
                });
            }
            const rivalMathLink = document.getElementById('rivalMathLink');
            if (rivalMathLink) {
                rivalMathLink.addEventListener('click', () => {
                    window.location.href = 'rivalmath.html';
                });
            }
            const duckLink = document.getElementById('duckLink');
            if (duckLink) {
                duckLink.addEventListener('click', () => {
                    window.location.href = 'duckmathshooter.html';
                });
            }
        </script>
    </body>
    </html>
